# Desktop process: no embedded web server
spring.main.web-application-type=none
spring.application.name=Salary Calculator

# Company files and registry live under this directory
payroll.data-directory=./data

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Flyway is run per company file, not against a datasource created at startup
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# Screen language. Use "en" for the English bundle.
payroll.locale=pt
